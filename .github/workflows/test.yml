name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Armeabi Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleArmeabiGenericNormalRelease assembleArmeabiGenericPythonRelease --stacktrace --build-cache --no-daemon

      - name: Collect and Verify APKs
        run: |
          mkdir -p ${{ github.workspace }}/release_apks/
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ${{ github.workspace }}/release_apks/ \;
          for apk in ${{ github.workspace }}/release_apks/*.apk; do
            echo "Checking signature for $apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v "$apk" || (
              echo "Signing $apk with debug key..."
              $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android "$apk"
              $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v "$apk"
            )
          done
          ls -lh ${{ github.workspace }}/release_apks/

      - name: Upload APKs to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Model-X3-APKs
          path: ${{ github.workspace }}/release_apks/*.apk
          if-no-files-found: error
